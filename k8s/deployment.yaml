apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker-deployment
  labels:
    app: tracker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tracker
  template:
    metadata:
      labels:
        app: tracker
    spec:
      containers:
        - name: tracker
          image: internship-tracker:1.0
          imagePullPolicy: Never      # use the image loaded into minikube
          ports:
            - containerPort: 8080
          # ENHANCEMENT: liveness + readiness probes
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
